name: Generate Tistory Blog Draft

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # merge commit 등 복잡한 히스토리도 안전하게 diff하기 위해 전체 히스토리를 받습니다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Get changed files in this push
        run: |
          # github.event.before / github.event.after 는 이번 push로 실제로
          # 바뀐 범위를 GitHub이 직접 알려주는 값이라 merge commit이 있어도 정확합니다.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            # 새 브랜치로의 첫 push인 경우
            git diff --name-only "$(git hash-object -t tree /dev/null)" "$AFTER" > changed_files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
          fi

          echo "----- changed files -----"
          cat changed_files.txt

      - name: Analyze code & generate blog draft(s)
        run: python scripts/analyze_solution.py changed_files.txt

      - name: Commit generated drafts back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-drafts/
          if git diff --cached --quiet; then
            echo "새로 생성된 초안이 없습니다."
            exit 0
          fi
          git commit -m "docs: 자동 생성된 티스토리 블로그 초안 추가 [skip ci]"
          git push
