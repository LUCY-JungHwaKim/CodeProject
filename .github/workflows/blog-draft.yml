name: Generate Tistory Blog Draft

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openai

      - name: Get changed files in this push
        run: |
          # 한글 파일/폴더명이 \355\224... 형태로 바뀌지 않도록 설정
          git config core.quotepath false

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            git diff --name-only "$(git hash-object -t tree /dev/null)" "$AFTER" > changed_files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
          fi

          echo "----- changed files -----"
          cat changed_files.txt

      - name: Analyze code & generate blog draft(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/analyze_solution.py changed_files.txt

      - name: Commit generated drafts back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add blog-drafts/

          if git diff --cached --quiet; then
            echo "새로 생성된 초안이 없습니다."
            exit 0
          fi

          git commit -m "docs: 자동 생성된 티스토리 블로그 초안 추가 [skip ci]"
          git push